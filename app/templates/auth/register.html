{% extends "base.html" %}

{% block title %}{{ t('register') }} | {{ t('app_name') }}{% endblock %}

{% block content %}
<section class="container py-5">
  <div class="form-panel mx-auto">
    <h1 class="h2 mb-4">{{ t('register') }}</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="email">{{ t('email') }}</label>
        <input class="form-control" id="email" name="email" type="email" required autocomplete="email">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">{{ t('password') }}</label>
        <input class="form-control" id="password" name="password" type="password" minlength="8" required autocomplete="new-password">
      </div>
      <p class="form-text">{{ t('password_minimum') }}</p>
      <button class="btn btn-primary" type="submit">{{ t('register') }}</button>
    </form>
  </div>
</section>
{% endblock %}
