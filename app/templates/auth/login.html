{% extends "base.html" %}

{% block title %}{{ t('login') }} | {{ t('app_name') }}{% endblock %}

{% block content %}
<section class="container py-5">
  <div class="form-panel mx-auto">
    <h1 class="h2 mb-4">{{ t('login') }}</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label class="form-label" for="email">{{ t('email') }}</label>
        <input class="form-control" id="email" name="email" type="email" required autocomplete="email">
      </div>
      <div class="mb-3">
        <label class="form-label" for="password">{{ t('password') }}</label>
        <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
      </div>
      <button class="btn btn-primary" type="submit">{{ t('login') }}</button>
    </form>
    <p class="mt-3 mb-0">
      {{ t('patient_new_account_prompt') }}
      <a href="{{ url_for('patient_link.link_account') }}">{{ t('link_patient') }}</a>
    </p>
  </div>
</section>
{% endblock %}
